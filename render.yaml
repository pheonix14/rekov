services:
  # Python FastAPI Backend
  - type: web
    name: rekov-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    envVars:
      - key: CORS_ORIGINS
        value: "https://rekov-frontend.onrender.com"

  # Next.js Frontend
  - type: web
    name: rekov-frontend
    env: docker
    dockerfilePath: ./rekoviu/Dockerfile
    dockerContext: ./rekoviu
    region: oregon
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://rekov-backend.onrender.com/api/v1"
